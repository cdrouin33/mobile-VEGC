<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mens Night League 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container hero-shell">
      <div>
        <div class="eyebrow" id="courseName">Vegreville Kinsmen Golf Club</div>
        <h1 id="title">2026 Mens Night League</h1>
        <p id="subtitle">Mobile-first public leaderboard, pairings, payouts, and season standings.</p>
      </div>
      <a href="mens-night-league-2026.pdf" target="_blank" class="button gold pdf-button">📄 League PDF</a>
    </div>
  </header>

  <main class="container main-stack">
    <section id="payoutBreakdowns" class="grid"></section>
    <section class="grid top-info-grid">
      <div id="weeklyInfo" class="card third"></div>
      <div id="weeklyPayouts" class="card third"></div>
      <div id="lastWeekPayouts" class="card third"></div>
    </section>
    <section class="grid">
      <div id="pairingsSection" class="card half"></div>
      <div id="leaderboardSection" class="card half"></div>
    </section>
    <section class="grid">
      <div id="preseasonStandings" class="card full"></div>
    </section>
    <section id="miniSeasonStandings" class="grid"></section>
    <section class="grid">
      <div id="seasonStandings" class="card full"></div>
    </section>
    <p class="footer-note">This page reads from <span class="mono">league-data.json</span>. Publish pairings from admin, then export and upload the JSON file to update the live site.</p>
  </main>

  <script src="app.js"></script>
  <script>window.MensNightLeague.initPublic();</script>
</body>
</html>
